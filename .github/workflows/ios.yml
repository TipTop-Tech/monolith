# ==========================================
# APPLE DISTRIBUTION WORKFLOW ONLY
# This workflow is strictly configured for Apple Distribution (Manual Signing).
# Note: Because this enforces Apple Distribution during the Archive step,
# Xcode's Automatic Signing cannot be used. You must ensure your provisioning
# profiles are either installed locally or explicitly managed.
# ==========================================
name: Setup iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install the Apple certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH

      - name: Install the provisioning profiles
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          echo -n "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/widget.mobileprovision
          
          # Extract UUIDs and Names
          APP_UUID=$(grep -aA1 UUID ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision | grep -o "[-A-Z0-9]\{36\}")
          WIDGET_UUID=$(grep -aA1 UUID ~/Library/MobileDevice/Provisioning\ Profiles/widget.mobileprovision | grep -o "[-A-Z0-9]\{36\}")
          APP_NAME=$(grep -aA1 '<key>Name</key>' ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision | grep '<string>' | sed -e 's/.*<string>\(.*\)<\/string>.*/\1/')
          WIDGET_NAME=$(grep -aA1 '<key>Name</key>' ~/Library/MobileDevice/Provisioning\ Profiles/widget.mobileprovision | grep '<string>' | sed -e 's/.*<string>\(.*\)<\/string>.*/\1/')
          
          # Rename to UUID
          mv ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$APP_UUID.mobileprovision
          mv ~/Library/MobileDevice/Provisioning\ Profiles/widget.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$WIDGET_UUID.mobileprovision
          
          # Export to ENV
          echo "APP_PROVISIONING_PROFILE=$APP_UUID" >> $GITHUB_ENV
          echo "WIDGET_PROVISIONING_PROFILE=$WIDGET_UUID" >> $GITHUB_ENV
          echo "APP_PROVISIONING_PROFILE_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "WIDGET_PROVISIONING_PROFILE_NAME=$WIDGET_NAME" >> $GITHUB_ENV

      - name: Generate ExportOptions.plist
        run: |
          cat << EOF > ios/App/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>teamID</key>
              <string>7R3NC9TF85</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.tiptop.monolith</key>
                  <string>${{ env.APP_PROVISIONING_PROFILE_NAME }}</string>
                  <key>com.tiptop.monolith.WorkoutWidget</key>
                  <string>${{ env.WIDGET_PROVISIONING_PROFILE_NAME }}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Create AuthKey file
        run: |
          mkdir -p $RUNNER_TEMP/AuthKey
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > $RUNNER_TEMP/AuthKey/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath $RUNNER_TEMP/AuthKey/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }} \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="7R3NC9TF85" \
            -verbose \
            clean archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath $RUNNER_TEMP/AuthKey/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/export/App.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}